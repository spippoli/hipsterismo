# On a v* tag: a signed release build and a draft GitHub Release (#108).
#
# 1. check: the tag is strict vMAJOR.MINOR.PATCH (MINOR, PATCH < 100) and its
#    commit is in master's history; otherwise the run fails before building.
# 2. emulators (#109): the debug app on x86_64 google_apis emulators, which
#    run the arm64 code through their ARM translator. API 34-37 run the
#    instrumented tests, core-on-device.sh and a launch plus one shutter Photo;
#    API 30-32 launch only. No performance figures come from them. The matrix
#    is android-emulators.yml.
# 3. release, only once every emulator leg passed (the `release` environment,
#    deployable only from v* tags, holds the signing secrets): the core tests,
#    the JVM tests, the signed assembleRelease, the keep-rule check and
#    apksigner, then a draft Release with the APK, its SHA-256, R8's mapping
#    and the native debug symbols.
#
# The draft is published by hand once the release APK passed the phone checks
# of android/TESTING.md.
name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# An explicit `shell: bash` runs with -eo pipefail; GitHub's implicit default
# is `bash -e`, without pipefail, so a failing command piped into tee or grep
# would pass.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versionName: ${{ steps.version.outputs.versionName }}
      versionCode: ${{ steps.version.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version from the tag
        id: version
        run: android/scripts/release-version.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Tag on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not in master's history"
            exit 1
          fi
          echo "$GITHUB_REF_NAME ($GITHUB_SHA) is in master's history"

  # The matrix lives in its own reusable workflow, so a branch can run it
  # without a tag (see CLAUDE.md).
  emulators:
    needs: check
    uses: ./.github/workflows/android-emulators.yml

  release:
    needs: [check, emulators]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.check.outputs.versionName }}
      VERSION_CODE: ${{ needs.check.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup

      - name: Core tests
        run: |
          cmake -S tests/core -B tests/core/build
          cmake --build tests/core/build -j "$(nproc)"
          tests/core/build/core_tests

      - name: JVM tests
        working-directory: android
        run: ./gradlew test

      # The keystore goes to the runner's temp folder, outside the workspace,
      # readable only by the runner's user, and is deleted at the end. GitHub
      # masks the secrets in the log.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # No configuration cache: the signing config reads the secrets while
      # configuring, so its entry would hold them.
      - name: Signed assembleRelease
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK
        working-directory: android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          scripts/check-release-apk.sh "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          # apksigner skips v2 when v3 covers minSdk 29; --min-sdk-version 24
          # makes it verify both.
          "$tools/apksigner" verify --verbose --min-sdk-version 24 "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/apksigner.txt"
          "$tools/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256'
          # sed, not head: head would close the pipe early, and pipefail
          # would fail the step on aapt2's SIGPIPE.
          badging=$("$tools/aapt2" dump badging "$apk" | sed -n 1p)
          echo "$badging"
          grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"

      - name: Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          apk="hipsterismo-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$dist/$apk"
          cp android/app/build/outputs/mapping/release/mapping.txt "$dist/mapping-$VERSION_NAME.txt"
          cp android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            "$dist/native-debug-symbols-$VERSION_NAME.zip"
          (cd "$dist" && sha256sum "$apk" > "$apk.sha256")
          sha=$(cut -d ' ' -f 1 "$dist/$apk.sha256")
          echo "SHA-256 $apk: $sha"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "Hipsterismo $VERSION_NAME" \
            --notes "SHA-256 of \`$apk\`: \`$sha\`" \
            "$dist/$apk" "$dist/$apk.sha256" \
            "$dist/mapping-$VERSION_NAME.txt" "$dist/native-debug-symbols-$VERSION_NAME.zip"
